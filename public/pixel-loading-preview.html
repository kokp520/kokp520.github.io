<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Art Loading Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Press Start 2P', monospace;
      background: #0F0E17;
      color: #FFFFFE;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100vw;
      padding: 24px;
      overflow: hidden;
      image-rendering: pixelated;
    }

    /* CRT Scanline Overlay Effect */
    .crt-scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 99;
    }

    /* Retro Loading Card Container */
    .pixel-card {
      background: #16161A;
      border: 4px solid #000000;
      padding: 40px 32px;
      box-shadow: 8px 8px 0px #000000, inset -3px -3px 0px #242629, inset 3px 3px 0px #383A3F;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      max-width: 480px;
      width: 90%;
      position: relative;
      z-index: 1;
    }

    /* Animated Pixel Icon */
    .pixel-spinner {
      width: 48px;
      height: 48px;
      background: #FF8E3C;
      border: 3px solid #000000;
      box-shadow: 4px 4px 0px #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: #0F0E17;
      animation: pixel-bounce 0.6s steps(2, start) infinite alternate;
    }

    /* Message */
    .loading-title {
      font-size: 0.85rem;
      color: #FFFFFE;
      letter-spacing: 1px;
      text-align: center;
      line-height: 1.6;
    }

    /* Pixel Progress Bar Container */
    .progress-track {
      width: 100%;
      height: 24px;
      background: #0F0E17;
      border: 3px solid #000000;
      box-shadow: inset 2px 2px 0px #000000;
      padding: 3px;
    }

    /* Progress Fill Animation */
    .progress-bar {
      height: 100%;
      background: #2CB67D;
      animation: pixel-bar-slide 1.2s steps(8, start) infinite;
    }

    /* Sub-status Blinking Text */
    .status-text {
      font-family: 'VT323', monospace;
      font-size: 1.4rem;
      color: #2CB67D;
      animation: pixel-blink 0.8s steps(2, start) infinite;
    }

    /* Pixel Keyframe Animations */
    @keyframes pixel-bounce {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }

    @keyframes pixel-bar-slide {
      0% { margin-left: 0%; width: 20%; }
      50% { margin-left: 50%; width: 35%; }
      100% { margin-left: 80%; width: 20%; }
    }

    @keyframes pixel-blink {
      0% { opacity: 1; }
      50% { opacity: 0; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- CRT Scanline Effect -->
  <div class="crt-scanlines"></div>

  <!-- Loading Card -->
  <div class="pixel-card">
    <!-- Animated Spinner -->
    <div class="pixel-spinner">▲</div>

    <!-- Title -->
    <div class="loading-title">LOADING SYSTEM...</div>

    <!-- Progress Bar -->
    <div class="progress-track">
      <div class="progress-bar"></div>
    </div>

    <!-- Blinking Status -->
    <div class="status-text">[PLEASE WAIT...]</div>
  </div>
</body>
</html>
