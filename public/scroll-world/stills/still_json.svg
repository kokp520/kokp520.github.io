<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <style>
      .bg { fill: #0F0E17; }
      .grid { stroke: #2A2A3B; stroke-width: 2; opacity: 0.4; }
      .green { fill: #2CB67D; }
      .mint { fill: #72F2B2; }
      .purple { fill: #7F5AF0; }
      .text-code { font-family: 'Press Start 2P', monospace; font-size: 28px; fill: #2CB67D; }
    </style>
    <pattern id="pixel-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" class="grid" />
    </pattern>
  </defs>

  <rect width="1200" height="800" class="bg" />
  <rect width="1200" height="800" fill="url(#pixel-grid)" />

  <!-- Isometric JSON Refinery -->
  <g transform="translate(600, 480)">
    <!-- Platform Base -->
    <polygon points="0,180 360,0 0,-180 -360,0" fill="#16161A" stroke="#2CB67D" stroke-width="6" />

    <!-- Neon Data Pipeline Towers -->
    <rect x="-140" y="-220" width="100" height="180" fill="#2A2A3B" stroke="#000000" stroke-width="8" />
    <rect x="40" y="-220" width="100" height="180" fill="#2A2A3B" stroke="#000000" stroke-width="8" />

    <!-- Curly Brackets Hologram -->
    <text x="-115" y="-120" class="text-code">{</text>
    <text x="65" y="-120" class="text-code">}</text>

    <!-- Glowing Data Stream Bars -->
    <rect x="-110" y="-80" width="220" height="16" fill="#2CB67D" stroke="#000000" stroke-width="4" />
    <rect x="-80" y="-40" width="160" height="16" fill="#72F2B2" stroke="#000000" stroke-width="4" />
    <rect x="-110" y="0" width="220" height="16" fill="#2CB67D" stroke="#000000" stroke-width="4" />

    <!-- Checkmark Badge -->
    <circle cx="0" cy="-280" r="40" fill="#2CB67D" stroke="#000000" stroke-width="6" />
    <path d="M -15,-280 L -5,-265 L 20,-295" fill="none" stroke="#0F0E17" stroke-width="8" stroke-linecap="square" />
  </g>

  <!-- Frame Border -->
  <rect x="20" y="20" width="1160" height="760" fill="none" stroke="#2CB67D" stroke-width="4" stroke-dasharray="16 8" />
</svg>
