<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <style>
      .bg { fill: #0F0E17; }
      .grid { stroke: #2A2A3B; stroke-width: 2; opacity: 0.4; }
      .accent { fill: #FF8E3C; }
      .green { fill: #2CB67D; }
      .text-title { font-family: 'Press Start 2P', monospace; font-size: 24px; fill: #FFFFFE; }
    </style>
    <pattern id="pixel-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" class="grid" />
    </pattern>
  </defs>

  <rect width="1200" height="800" class="bg" />
  <rect width="1200" height="800" fill="url(#pixel-grid)" />

  <!-- Isometric Arcade Cabinet Machine -->
  <g transform="translate(600, 480)">
    <!-- Platform Base -->
    <polygon points="0,180 360,0 0,-180 -360,0" fill="#16161A" stroke="#FF8E3C" stroke-width="6" />

    <!-- Arcade Machine Cabinet -->
    <path d="M -90,-260 L 90,-260 L 110,-120 L 110,40 L -110,40 L -110,-120 Z" fill="#2A2A3B" stroke="#000000" stroke-width="8" />

    <!-- Marquee Sign -->
    <rect x="-80" y="-250" width="160" height="40" fill="#FF8E3C" stroke="#000000" stroke-width="4" />
    <text x="-65" y="-222" font-family="'Press Start 2P', monospace" font-size="16" fill="#0F0E17">ARCADE</text>

    <!-- CRT Screen -->
    <rect x="-75" y="-195" width="150" height="95" fill="#0F0E17" stroke="#2CB67D" stroke-width="4" />
    <text x="-55" y="-140" font-family="'Press Start 2P', monospace" font-size="12" fill="#2CB67D">INSERT COIN</text>

    <!-- Control Deck & Joystick -->
    <polygon points="-90,-90 90,-90 100,-40 -100,-40" fill="#16161A" stroke="#000000" stroke-width="4" />
    <circle cx="-40" cy="-65" r="10" fill="#FF8E3C" />
    <circle cx="-10" cy="-65" r="10" fill="#2CB67D" />
    <circle cx="20" cy="-65" r="10" fill="#7F5AF0" />
    <rect x="50" y="-75" width="8" height="20" fill="#000000" />
    <circle cx="54" cy="-80" r="10" fill="#FF8E3C" />
  </g>

  <!-- Frame Border -->
  <rect x="20" y="20" width="1160" height="760" fill="none" stroke="#FF8E3C" stroke-width="4" stroke-dasharray="16 8" />
</svg>
