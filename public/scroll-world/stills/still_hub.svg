<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <style>
      .bg { fill: #0F0E17; }
      .grid { stroke: #2A2A3B; stroke-width: 2; opacity: 0.4; }
      .pixel-box { fill: #16161A; stroke: #000000; stroke-width: 6; }
      .screen-glow { fill: #2CB67D; opacity: 0.15; filter: blur(20px); }
      .accent { fill: #FF8E3C; }
      .green { fill: #2CB67D; }
      .purple { fill: #7F5AF0; }
      .text-title { font-family: 'Press Start 2P', monospace; font-size: 32px; fill: #FFFFFE; }
      .text-sub { font-family: 'VT323', monospace; font-size: 28px; fill: #2CB67D; }
    </style>
    <pattern id="pixel-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" class="grid" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" class="bg" />
  <rect width="1200" height="800" fill="url(#pixel-grid)" />

  <!-- CRT Scanlines -->
  <rect width="1200" height="800" fill="none" stroke="#2CB67D" stroke-width="1" opacity="0.08" />

  <!-- Isometric Pixel Platform -->
  <g transform="translate(600, 480)">
    <!-- Platform Base Shadow -->
    <polygon points="0,180 360,0 0,-180 -360,0" fill="#000000" opacity="0.6" transform="translate(0, 30)" />
    <!-- Platform Top -->
    <polygon points="0,180 360,0 0,-180 -360,0" fill="#16161A" stroke="#2CB67D" stroke-width="6" />
    <!-- Grid on Platform -->
    <path d="M -180,-90 L 180,90 M -180,90 L 180,-90 M -90,-135 L 270,45 M -270,45 L 90,-135" stroke="#2A2A3B" stroke-width="3" />

    <!-- Central Server Rack -->
    <rect x="-80" y="-220" width="160" height="200" fill="#2A2A3B" stroke="#000000" stroke-width="8" />
    <rect x="-65" y="-200" width="130" height="40" fill="#0F0E17" stroke="#2CB67D" stroke-width="4" />
    <rect x="-65" y="-140" width="130" height="40" fill="#0F0E17" stroke="#FF8E3C" stroke-width="4" />
    <rect x="-65" y="-80" width="130" height="40" fill="#0F0E17" stroke="#7F5AF0" stroke-width="4" />

    <!-- Server Lights -->
    <circle cx="-40" cy="-180" r="6" class="green" />
    <circle cx="-20" cy="-180" r="6" class="green" />
    <circle cx="0" cy="-180" r="6" class="accent" />
    <circle cx="-40" cy="-120" r="6" class="accent" />
    <circle cx="-20" cy="-120" r="6" class="green" />
    <circle cx="0" cy="-120" r="6" class="purple" />

    <!-- Floating Hologram Logo -->
    <polygon points="0,-290 40,-310 0,-330 -40,-310" fill="#FF8E3C" stroke="#000000" stroke-width="4" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="600" cy="380" r="280" class="screen-glow" />

  <!-- Frame Border -->
  <rect x="20" y="20" width="1160" height="760" fill="none" stroke="#2CB67D" stroke-width="4" stroke-dasharray="16 8" />
</svg>
