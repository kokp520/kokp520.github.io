<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <style>
      .bg { fill: #0F0E17; }
      .grid { stroke: #2A2A3B; stroke-width: 2; opacity: 0.4; }
      .purple { fill: #7F5AF0; }
      .accent { fill: #FF8E3C; }
      .mint { fill: #72F2B2; }
      .text-code { font-family: 'Press Start 2P', monospace; font-size: 24px; fill: #7F5AF0; }
    </style>
    <pattern id="pixel-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" class="grid" />
    </pattern>
  </defs>

  <rect width="1200" height="800" class="bg" />
  <rect width="1200" height="800" fill="url(#pixel-grid)" />

  <!-- Isometric YAML Tower -->
  <g transform="translate(600, 480)">
    <!-- Platform Base -->
    <polygon points="0,180 360,0 0,-180 -360,0" fill="#16161A" stroke="#7F5AF0" stroke-width="6" />

    <!-- Control Tower Monitor -->
    <rect x="-140" y="-230" width="280" height="180" fill="#2A2A3B" stroke="#000000" stroke-width="8" />
    <rect x="-120" y="-210" width="240" height="140" fill="#0F0E17" stroke="#7F5AF0" stroke-width="4" />

    <!-- Indented YAML Nodes -->
    <rect x="-100" y="-190" width="80" height="12" fill="#7F5AF0" />
    <rect x="-70" y="-165" width="120" height="12" fill="#FF8E3C" />
    <rect x="-70" y="-140" width="90" height="12" fill="#2CB67D" />
    <rect x="-40" y="-115" width="100" height="12" fill="#72F2B2" />

    <!-- Conversion Arrow Icon -->
    <polygon points="0,-290 30,-270 10,-270 10,-240 -10,-240 -10,-270 -30,-270" fill="#FF8E3C" stroke="#000000" stroke-width="4" />
  </g>

  <!-- Frame Border -->
  <rect x="20" y="20" width="1160" height="760" fill="none" stroke="#7F5AF0" stroke-width="4" stroke-dasharray="16 8" />
</svg>
