<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <style>
      .bg { fill: #0F0E17; }
      .grid { stroke: #2A2A3B; stroke-width: 2; opacity: 0.4; }
      .accent { fill: #FF8E3C; }
      .green { fill: #2CB67D; }
      .purple { fill: #7F5AF0; }
    </style>
    <pattern id="pixel-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" class="grid" />
    </pattern>
  </defs>

  <rect width="1200" height="800" class="bg" />
  <rect width="1200" height="800" fill="url(#pixel-grid)" />

  <!-- Isometric GIF Factory -->
  <g transform="translate(600, 480)">
    <!-- Platform Base -->
    <polygon points="0,180 360,0 0,-180 -360,0" fill="#16161A" stroke="#FF8E3C" stroke-width="6" />

    <!-- Film Reel & Frame Extractor Machine -->
    <rect x="-120" y="-200" width="240" height="160" fill="#2A2A3B" stroke="#000000" stroke-width="8" />
    <!-- Film Reel Circle -->
    <circle cx="-50" cy="-120" r="45" fill="#FF8E3C" stroke="#000000" stroke-width="6" />
    <circle cx="-50" cy="-120" r="15" fill="#0F0E17" />
    <circle cx="50" cy="-120" r="45" fill="#2CB67D" stroke="#000000" stroke-width="6" />
    <circle cx="50" cy="-120" r="15" fill="#0F0E17" />

    <!-- Conveyor Belt with Pixel Frames -->
    <polygon points="-160,20 160,20 200,60 -200,60" fill="#0F0E17" stroke="#FF8E3C" stroke-width="4" />
    <!-- Frames -->
    <rect x="-130" y="28" width="40" height="24" fill="#FF8E3C" stroke="#000000" stroke-width="2" />
    <rect x="-60" y="28" width="40" height="24" fill="#2CB67D" stroke="#000000" stroke-width="2" />
    <rect x="10" y="28" width="40" height="24" fill="#7F5AF0" stroke="#000000" stroke-width="2" />
    <rect x="80" y="28" width="40" height="24" fill="#FFFFFE" stroke="#000000" stroke-width="2" />

    <!-- ZIP Box Output -->
    <rect x="-40" y="-280" width="80" height="60" fill="#FF8E3C" stroke="#000000" stroke-width="6" />
    <path d="M -40,-250 L 40,-250 M 0,-280 L 0,-220" stroke="#000000" stroke-width="4" />
  </g>

  <!-- Frame Border -->
  <rect x="20" y="20" width="1160" height="760" fill="none" stroke="#FF8E3C" stroke-width="4" stroke-dasharray="16 8" />
</svg>
