<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIF to ZIP | Adi's Tools</title>
  <script src="./omggif.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(22, 27, 43, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --secondary: #ec4899;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
      background: var(--bg-color);
      background-image: 
        radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.15) 0px, transparent 50%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 40px;
      border-radius: 24px;
      border: 1px solid var(--card-border);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255,255,255,0.05) inset;
      max-width: 540px;
      width: 100%;
      text-align: center;
      transform: translateY(0);
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.4s ease;
    }
    
    .container:hover {
      transform: translateY(-5px);
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255,255,255,0.08) inset;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #e879f9, #8b5cf6, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1rem;
      font-weight: 300;
      margin-bottom: 32px;
    }

    .drop-zone {
      border: 2px dashed rgba(139, 92, 246, 0.4);
      border-radius: 16px;
      padding: 40px 20px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      background: rgba(139, 92, 246, 0.03);
      position: relative;
      overflow: hidden;
    }

    .drop-zone::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at center, rgba(139,92,246,0.1) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .drop-zone:hover {
      border-color: var(--primary);
      background: rgba(139, 92, 246, 0.08);
      transform: scale(1.02);
    }
    
    .drop-zone:hover::before {
      opacity: 1;
    }

    .drop-zone-text {
      position: relative;
      z-index: 1;
      font-weight: 500;
      color: #cbd5e1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    
    .drop-zone-icon {
      font-size: 2rem;
      background: linear-gradient(135deg, #e879f9, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .settings {
      margin: 28px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.5);
      padding: 16px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .settings label {
      font-size: 1rem;
      font-weight: 400;
      color: #cbd5e1;
    }

    input[type="number"] {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      width: 90px;
      font-size: 1rem;
      font-family: inherit;
      text-align: center;
      transition: all 0.2s;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
    }

    button {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      padding: 16px 32px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
      position: relative;
      overflow: hidden;
    }

    button::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(139, 92, 246, 0.5);
    }
    
    button:hover:not(:disabled)::after {
      opacity: 1;
    }

    button:active:not(:disabled) {
      transform: translateY(1px);
    }

    button:disabled {
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.3);
      box-shadow: none;
      cursor: not-allowed;
    }

    #status {
      margin-top: 20px;
      font-size: 0.95rem;
      color: #38bdf8;
      font-weight: 500;
      min-height: 1.5em;
      transition: all 0.3s ease;
      letter-spacing: 0.02em;
    }

    .preview-box {
      margin: 24px 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      animation: fadeIn 0.5s ease;
    }

    .preview-box label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      font-weight: 600;
    }

    .preview-box img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    .result-box {
      margin-top: 32px;
      padding: 24px;
      background: rgba(16, 185, 129, 0.05);
      border-radius: 16px;
      border: 1px solid rgba(16, 185, 129, 0.2);
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      animation: slideUp 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .result-box label {
      color: var(--success);
      font-weight: 600;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .result-box img {
      max-width: 100%;
      max-height: 180px;
      border-radius: 12px;
      border: 2px solid var(--success);
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.2);
    }

    .result-box a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--success);
      color: white;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1.05rem;
      transition: all 0.3s ease;
      width: 100%;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
    }

    .result-box a:hover {
      background: #059669;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>GIF to ZIP</h1>

    <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
      <div class="drop-zone-text" id="dropText">
        <span class="drop-zone-icon">✨</span>
        <span>點擊選擇或拖曳 GIF 檔案至此</span>
      </div>
      <input type="file" id="fileInput" accept="image/gif" style="display: none;">
    </div>
    
    <div class="preview-box" id="previewBox">
      <label>GIF 預覽</label>
      <img id="previewImg" src="" alt="GIF 預覽">
    </div>

    <div class="settings">
      <label for="frameCount">目標影格數：</label>
      <input type="number" id="frameCount" value="100" min="1" max="500">
    </div>

    <button id="processBtn" disabled>開始轉換</button>
    <div id="status"></div>
    
    <div class="result-box" id="resultBox">
      <label>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        轉換完成！
      </label>
      <img id="resultThumb" src="" alt="轉換結果縮圖">
      <a id="downloadLink" href="#" download="frames.zip">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        下載 ZIP 壓縮包
      </a>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.querySelector('.drop-zone');
    const dropText = document.getElementById('dropText');
    const processBtn = document.getElementById('processBtn');
    const status = document.getElementById('status');
    const frameCountInput = document.getElementById('frameCount');
    
    const previewBox = document.getElementById('previewBox');
    const previewImg = document.getElementById('previewImg');
    
    const resultBox = document.getElementById('resultBox');
    const resultThumb = document.getElementById('resultThumb');
    const downloadLink = document.getElementById('downloadLink');

    let selectedFile = null;

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) handleFile(e.target.files[0]);
    });

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.style.borderColor = '#8b5cf6';
      dropZone.style.background = 'rgba(139, 92, 246, 0.08)';
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.style.borderColor = 'rgba(139, 92, 246, 0.4)';
      dropZone.style.background = 'rgba(139, 92, 246, 0.03)';
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.style.borderColor = 'rgba(139, 92, 246, 0.4)';
      dropZone.style.background = 'rgba(139, 92, 246, 0.03)';
      if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
    });

    function handleFile(file) {
      if (file.type !== 'image/gif') {
        alert('請選擇 GIF 檔案！');
        return;
      }
      selectedFile = file;
      dropText.innerHTML = `<span class="drop-zone-icon">📁</span><span>已選擇：${file.name}</span>`;
      
      // 顯示預覽
      previewImg.src = URL.createObjectURL(file);
      previewBox.style.display = 'flex';
      resultBox.style.display = 'none';
      
      processBtn.disabled = false;
      status.innerText = '';
    }

    processBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      processBtn.disabled = true;
      resultBox.style.display = 'none';
      status.innerText = '讀取 GIF 中... (這可能需要幾秒鐘)';
      
      // 讓瀏覽器有時間更新 UI
      await new Promise(r => setTimeout(r, 50));

      try {
        const buffer = await selectedFile.arrayBuffer();
        const byteArray = new Uint8Array(buffer);
        
        // 確保 omggif 已載入
        if (typeof omggif === 'undefined' || !omggif.GifReader) {
            throw new Error("omggif 函式庫未正確載入");
        }

        const reader = new omggif.GifReader(byteArray);

        const totalFrames = reader.numFrames();
        const width = reader.width;
        const height = reader.height;

        status.innerText = `解析成功！原始影格：${totalFrames} 幀，準備提取...`;
        await new Promise(r => setTimeout(r, 50)); // Yield

        const extractedFrames = [];
        
        // 共用的像素陣列，用來實現圖層疊加與處理 GIF Disposal Method
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        const imageData = ctx.createImageData(width, height);
        
        let previousImageData = null;
        
        for (let i = 0; i < totalFrames; i++) {
          const frameInfo = reader.frameInfo(i);
          
          // 如果這幀的處置方式是「還原成上一幀 (Disposal 3)」，需先備份目前的狀態
          if (frameInfo.disposal === 3) {
             previousImageData = new Uint8ClampedArray(imageData.data);
          }

          // 將這幀畫到累積的 imageData 上（omggif 會自動跳過透明像素並覆蓋其他像素）
          reader.decodeAndBlitFrameRGBA(i, imageData.data);
          
          // 產生一張新的 Canvas 來保存這幀的最終畫面
          const tempCanvas = document.createElement('canvas');
          tempCanvas.width = width;
          tempCanvas.height = height;
          const tempCtx = tempCanvas.getContext('2d');
          tempCtx.putImageData(imageData, 0, 0);
          extractedFrames.push(tempCanvas);
          
          // 處理下一幀繪製前的畫面清除 (Disposal Method)
          if (frameInfo.disposal === 2) {
             // 處置方式 2：還原為背景色 (在 GIF 裡通常為透明)。只清除這個 frame 更新的區域
             for (let y = frameInfo.y; y < frameInfo.y + frameInfo.height; y++) {
                 for (let x = frameInfo.x; x < frameInfo.x + frameInfo.width; x++) {
                     const idx = (y * width + x) * 4;
                     imageData.data[idx] = 0;
                     imageData.data[idx+1] = 0;
                     imageData.data[idx+2] = 0;
                     imageData.data[idx+3] = 0; // 透明
                 }
             }
          } else if (frameInfo.disposal === 3 && previousImageData) {
             // 處置方式 3：還原為上一幀 (丟棄這個 frame 所做的改變)
             imageData.data.set(previousImageData);
          }
          
          // 更新進度並讓出 Main Thread 防止畫面卡死
          if (i % 5 === 0) {
              status.innerText = `正在提取影格... (${i+1}/${totalFrames})`;
              await new Promise(r => setTimeout(r, 10)); // Yield to prevent unresponsiveness
          }
        }

        const targetCount = parseInt(frameCountInput.value) || 100;
        status.innerText = `打包中... 生成 ${targetCount} 張 PNG`;
        await new Promise(r => setTimeout(r, 50));

        const zip = new JSZip();

        for (let i = 0; i < targetCount; i++) {
          const frameCanvas = extractedFrames[i % totalFrames];
          
          // 如果是第一張，將其設為縮圖
          if (i === 0) {
              resultThumb.src = frameCanvas.toDataURL('image/png');
          }
          
          const blob = await new Promise(resolve => frameCanvas.toBlob(resolve, 'image/png'));
          const fileName = `frame_${String(i + 1).padStart(3, '0')}.png`;
          zip.file(fileName, blob);
          
          if (i % 10 === 0) {
              status.innerText = `加入壓縮包... (${i+1}/${targetCount})`;
              await new Promise(r => setTimeout(r, 10));
          }
        }

        status.innerText = '正在壓縮成 ZIP 檔...';
        await new Promise(r => setTimeout(r, 50));
        
        const zipBlob = await zip.generateAsync({ type: 'blob' });

        // 建立下載連結
        const zipUrl = URL.createObjectURL(zipBlob);
        const baseName = selectedFile.name.replace(/\.[^/.]+$/, "");
        
        downloadLink.href = zipUrl;
        downloadLink.download = `${baseName}_${targetCount}pngs.zip`;
        
        // 顯示結果區塊
        resultBox.style.display = 'flex';
        status.innerText = '';
        
      } catch (err) {
        console.error(err);
        status.innerText = '❌ 轉換失敗：' + err.message;
      } finally {
        processBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
